# Production overlay for the shared VM:
#   docker compose -f compose.yaml -f deploy/compose.prod.yaml --env-file .env up -d --build
# Secrets come from /opt/seatres/.env (generated by deploy/vm/bootstrap.sh, never committed).
# Limits are sized to leave headroom for the other apps on this 2 vCPU / 4 GB VM.
services:
  postgres:
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_wal_size=512MB"]
    deploy: { resources: { limits: { cpus: "0.8", memory: 512M } } }

  api:
    image: seatres-api:prod
    environment:
      SeatRes__AdmissionPermits: "512"
      SeatRes__AdmissionQueue: "30000"
      Gateway__LatencyMillis: "30"
    deploy: { resources: { limits: { cpus: "1.2", memory: 512M } } }

  prometheus:
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=11d", "--storage.tsdb.retention.size=512MB"]
    deploy: { resources: { limits: { cpus: "0.3", memory: 192M } } }

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://${SEATRES_FQDN}/grafana/
    deploy: { resources: { limits: { cpus: "0.3", memory: 192M } } }

  dozzle:
    deploy: { resources: { limits: { cpus: "0.2", memory: 64M } } }

  caddy:
    image: caddy:2
    network_mode: host
    environment:
      SEATRES_FQDN: ${SEATRES_FQDN}
      LOGS_USER: ${LOGS_USER}
      LOGS_HASH: ${LOGS_HASH}
      # Thousands of concurrent TLS connections: let the Go GC work hard well before the cgroup limit.
      GOMEMLIMIT: 760MiB
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    # ~57 KB per TLS connection measured: 896M is ~13k concurrent connections; seatres-net caps at 12k.
    deploy: { resources: { limits: { cpus: "0.8", memory: 896M } } }
    restart: unless-stopped

volumes:
  caddydata:
  caddyconfig:
