# Production overlay for the shared VM:
#   docker compose -f compose.yaml -f deploy/compose.prod.yaml --env-file .env up -d --build
# Secrets come from /opt/seatres/.env (generated by deploy/vm/bootstrap.sh, never committed).
# Limits are sized to leave headroom for the other apps on this 2 vCPU / 4 GB VM.
services:
  postgres:
    cpu_shares: 512   # yield to the VM's other apps when CPU is contended
    oom_score_adj: -500   # if the whole VM runs out of memory, the kernel picks other processes first
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_wal_size=512MB"]
    deploy: { resources: { limits: { cpus: "0.8", memory: 512M } } }

  api:
    image: seatres-api:prod
    cpu_shares: 512
    oom_score_adj: -500
    # Fixed address so the edge proxy dials the container directly, not through Docker's userland port proxy
    # (which timed out dialling under ~10k concurrent connections).
    networks:
      default:
        ipv4_address: 172.31.250.20
    environment:
      SeatRes__AdmissionPermits: "512"
      SeatRes__AdmissionQueue: "30000"
      Gateway__LatencyMillis: "30"
    deploy: { resources: { limits: { cpus: "1.2", memory: 512M } } }

  prometheus:
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=11d", "--storage.tsdb.retention.size=512MB"]
    deploy: { resources: { limits: { cpus: "0.3", memory: 160M } } }

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://${SEATRES_FQDN}/grafana/
    deploy: { resources: { limits: { cpus: "0.3", memory: 160M } } }

  dozzle:
    deploy: { resources: { limits: { cpus: "0.2", memory: 64M } } }

  caddy:
    image: caddy:2
    network_mode: host
    cpu_shares: 512
    oom_score_adj: -500
    ulimits: { nofile: { soft: 65535, hard: 65535 } }
    environment:
      SEATRES_FQDN: ${SEATRES_FQDN}
      API_UPSTREAM: 172.31.250.20:8080
      LOGS_USER: ${LOGS_USER}
      LOGS_HASH: ${LOGS_HASH}
      # Thousands of concurrent TLS connections: let the Go GC work hard well before the cgroup limit.
      GOMEMLIMIT: 1600MiB
    volumes:
      # Directory mount: a single-file bind mount keeps serving the old file after git replaces it.
      - ./deploy/caddy:/etc/caddy:ro
      - caddydata:/data
      - caddyconfig:/config
    # ~57 KB per TLS connection measured: 1800M is ~28k concurrent connections; seatres-net caps at 24k
    # (the brief's ~20k concurrent, with headroom).
    # TLS handshakes are CPU: allow the edge most of the VM when it is free (cpu_shares keeps others first).
    deploy: { resources: { limits: { cpus: "1.6", memory: 1800M } } }
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  caddydata:
  caddyconfig:
