name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Unit and integration tests (real Postgres via Testcontainers)
        run: dotnet test SeatRes.slnx --logger "console;verbosity=normal"

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Alert rules are valid
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p" prom/prometheus:v3.5.0 check rules /p/alerts.yml
      - name: Build and start the stack from a clean checkout
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/health/ready && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Burst (quick) against the running stack
        run: ./burst.sh http://127.0.0.1:8080 --quick
      - name: Readiness fails closed without the database
        run: |
          docker compose stop postgres
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready)
          test "$code" = "503"
      - if: failure()
        run: docker compose logs --tail 200 api
